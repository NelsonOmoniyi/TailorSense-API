{% load static %}
<!-- Shared <head> block for the public, non-workspace pages (login, register).
     Keeps the meta tags and stylesheet links in one place so those pages stay
     consistent. Workspace pages extend base.html instead. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="TailorSense — a smart tailoring and fashion hub for modern, personalized fashion.">
    <title>TailorSense | Smart Fashion, Tailored for You</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/landing.css' %}">
    <link rel="stylesheet" href="{% static 'css/login.css' %}">    
</head>
